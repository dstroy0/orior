sonar.projectKey=dstroy0_orior
sonar.organization=dstroy0

sonar.projectName=orior

# Paths are relative to this file.
#
# sources and tests are split so test code does not count against the sources' duplication and complexity, and a
# rule for shipped code is not raised against a fixture. MMgr and embedded_types are submodules with their own
# repositories and scans, and they are not sources here.
sonar.sources=src,includes,ui
sonar.tests=utils/test/src
sonar.sourceEncoding=UTF-8

sonar.exclusions=build/**,includes/mmgr/**,includes/embedded_types/**,ui/test/**,ui/docs/**
sonar.test.inclusions=utils/test/src/**
sonar.test.exclusions=**/unity_runner.c

# Written during the run, under build/ and not committed: the build wrapper records how each translation unit is compiled,
# utils/maint/engine/clangd_database.py adds each source of src and includes that the build does not compile, and gcovr
# writes the merged coverage.
sonar.cfamily.compile-commands=build/sonarqube/compile_commands.json
sonar.coverageReportPaths=build/sonarqube/coverage.xml

# every file read afresh on each scan: the C analyzer's cache is in a folder each run starts empty, since findings
# served from the server's cache describe code that is gone
sonar.analysisCache.enabled=false
sonar.cfamily.analysisCache.mode=fs
sonar.cfamily.analysisCache.path=build/sonarqube/analysis_cache

sonar.projectKey=dstroy0_orior
sonar.organization=dstroy0

sonar.projectName=orior

# Paths are relative to this file.
#
# sources and tests are split so test code does not count against the sources' duplication and complexity, and a
# rule for shipped code is not raised against a fixture. MMgr has its own project and its own scan, and is not a source here.
sonar.sources=ui,src/cu/includes/file_defs,src/cu/includes/formats,src/cu/includes/parsers
sonar.tests=ui/test,utils/test/src
sonar.sourceEncoding=UTF-8

sonar.exclusions=build/**,ui/test/**,ui/**/target/**,ui/docs/**,ui/gui/src-tauri/**,ui/gui/src-js/**
sonar.test.inclusions=ui/test/**,utils/test/src/**
sonar.test.exclusions=ui/test/target/**,ui/test/runs/**,**/unity_runner.c

# Written during the run, under build/ and not committed: the build wrapper records how each translation unit is compiled,
# and gcovr writes the merged coverage.
sonar.cfamily.compile-commands=build/sonarqube/bw-output/compile_commands.json
sonar.coverageReportPaths=build/sonarqube/coverage.xml

# every file read afresh on each scan: the C analyzer's cache stands in a folder each run starts empty, since findings
# served from the server's cache describe code that is gone
sonar.analysisCache.enabled=false
sonar.cfamily.analysisCache.mode=fs
sonar.cfamily.analysisCache.path=build/sonarqube/analysis_cache

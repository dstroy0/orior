#
# What CodeQL reads of the app: src/ui, less what is built there and the test runs' records.

name: orior app

queries:
  - uses: security-and-quality

paths:
  - src/ui

paths-ignore:
  - src/ui/**/target
  - src/ui/test/runs
  - src/ui/test/fixtures

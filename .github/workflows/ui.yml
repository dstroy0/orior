#
# The app's tests, by its own harness, on each push to main and each pull request that changes the
# app, each on the system's own runner:
#
#   cli     the command line's checks on Ubuntu for x86-64 and for arm64, on Windows and on macOS;
#   window  the window's C checks on Ubuntu for x86-64 and for arm64, on X's display in memory, and on
#           Windows; macOS has no window to check.
#
# A push to main that changes the app's Markdown alone runs nothing; a pull request is matched by
# all it changes. The job fails where any check fails.

name: ui

on:
  push:
    branches: [main]
    paths:
      - "ui/**"
      - "src/cu/**"
      - "utils/test/**"
      - ".github/workflows/ui.yml"
      - "!ui/**/*.md"
  pull_request:
    paths:
      - "ui/**"
      - "src/cu/**"
      - "utils/test/**"
      - ".github/workflows/ui.yml"
      - "!ui/**/*.md"
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch stops the run it makes stale.
concurrency:
  group: ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cli:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev build-essential clang lld llvm cmake ninja-build ruby

      - name: Rust, where the runner has none
        run: |
          if ! command -v cargo > /dev/null; then
            curl -sSf --retry 3 https://sh.rustup.rs | sh -s -- -y --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi

      - name: The command line's checks
        run: python utils/test/harness.py cli test

      - name: The install bundle, installed and removed
        run: python utils/test/harness.py package --check

  window:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential clang lld llvm cmake ninja-build libx11-dev libssl-dev xvfb fonts-dejavu-core

      - name: The window's checks
        if: runner.os == 'Linux'
        run: xvfb-run -a -s '-screen 0 1920x1080x24 -dpi 96' python utils/test/harness.py window check

      - name: The window's checks
        if: runner.os == 'Windows'
        run: python utils/test/harness.py window check

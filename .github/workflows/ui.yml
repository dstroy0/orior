#
# The app's tests, by its own harness, on each push to main and each pull request that changes the
# app. Two jobs, each on Linux:
#
#   rust    the Rust tests of the command line, the app and the harness, with the test servers in
#           Docker, and the command line on each other system Docker runs;
#   window  every test of the window, the real window built in the harness's Docker image and driven
#           through WebDriver, every press, key, drag and wheel sent as WebDriver's actions.
#
# A push to main that changes the app's Markdown alone runs nothing; a pull request is matched by
# all it changes. Each job keeps the harness's report as an artifact. The harness fails a run where
# any test fails or any part of the app has no test, and the job fails with it.

name: ui

on:
  push:
    branches: [main]
    paths:
      - "ui/**"
      - "src/cu/**"
      - ".github/workflows/ui.yml"
      - "!ui/**/*.md"
  pull_request:
    paths:
      - "ui/**"
      - "src/cu/**"
      - ".github/workflows/ui.yml"
      - "!ui/**/*.md"
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch stops the run it makes stale.
concurrency:
  group: ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cli:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Linux libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev build-essential

      - name: The command line's checks
        run: python utils/test/harness.py cli test

  window:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: The window's suite, in Docker
        run: python utils/test/harness.py window test --docker

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-window
          path: |
            build/ui_test/runs/*/report.md
            build/ui_test/runs/*/window.log
            build/ui_test/runs/*/webdriver.log

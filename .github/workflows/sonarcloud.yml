#
# SonarQube Cloud analysis plus coverage, on each push to main and each pull request. Settings are in
# sonar-project.properties.
#
# The scanner reads C through a compile database: the build wrapper wraps the real build and records every compiler
# invocation. Without it the C files are skipped.
#
# Coverage comes from gcov. `cli coverage build` compiles with --coverage, each object writing .gcno as it compiles and
# .gcda when a program linking it ends. `cli coverage test` runs every Unity suite to write the .gcda, and
# `cli coverage report` merges them through gcovr. No .gcda exists until the tests have run.
#
# Three settings are made by hand once. The project at sonarcloud.io is created from this repository in the organization
# dstroy0 with the key dstroy0_orior. Its Automatic Analysis is off, since it and this workflow cannot both run. Its token
# is the repository's secret SONAR_TOKEN.

name: sonarcloud

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: sonar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # A pull request from a fork has no secrets, and its scan would fail on the missing token.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      # The whole history: a shallow clone breaks blame-based new-code detection. MMgr and embedded_types are submodules
      # every C source includes.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Linux libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev libx11-dev build-essential clang lld llvm cmake ninja-build ruby

      - name: Install gcovr
        run: pip install --upgrade gcovr

      - name: Install build wrapper
        uses: SonarSource/sonarqube-scan-action/install-build-wrapper@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8

      - name: Build (wrapped)
        run: |
          mkdir -p build/sonarqube
          build-wrapper-linux-x86-64 --out-dir build/sonarqube/bw-output python utils/test/harness.py cli coverage build

      # The suites write the .gcda. A failing test still lets the scan report, and fails this job at its last step.
      - name: Test
        id: suites
        continue-on-error: true
        run: python utils/test/harness.py cli coverage test

      - name: Coverage report
        continue-on-error: true
        run: python utils/test/harness.py cli coverage report

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Suites passed
        if: steps.suites.outcome == 'failure'
        run: exit 1

<html lang="en" data-scheme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>orior</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="bar">
      <span class="mark" aria-hidden="true">Σ</span>
      <nav class="menubar" id="menubar" role="menubar" aria-label="orior"></nav>
      <span class="tree" id="tree-path"></span>
      <span class="pulse" id="pulse"></span>
      <button class="scheme" id="scheme" type="button" aria-label="Light"></button>
    </header>

    <main class="shell">
      <section class="mode" id="mode-run" data-active="true">
        <aside class="side">
          <input class="filter" id="job-filter" type="search" placeholder="Search" spellcheck="false" />
          <div class="jobs" id="jobs"></div>
        </aside>
        <div class="stage" id="job-stage"></div>
      </section>

      <section class="mode" id="mode-edit" data-active="false">
        <aside class="side">
          <input class="filter" id="file-filter" type="search" placeholder="Search" spellcheck="false" />
          <div class="files" id="files"></div>
        </aside>
        <div class="desk">
          <div class="tabs" id="tabs" role="tablist"></div>
          <div class="editor" id="editor"></div>
          <div class="binary" id="binary" hidden></div>
          <div class="empty" id="edit-empty" hidden>
            <canvas class="lattice" aria-hidden="true"></canvas>
            <div class="empty-body">
              <h1>orior</h1>
              <p id="edit-empty-tree"></p>
            </div>
          </div>
        </div>
        <aside class="defs" id="defs"></aside>
      </section>

      <section class="loading" id="loading">
        <canvas class="lattice" aria-hidden="true"></canvas>
        <div class="eye-box" aria-hidden="true">
          <canvas class="eye"></canvas>
          <canvas class="plasma"></canvas>
        </div>
      </section>

      <section class="open" id="open-tree" hidden>
        <canvas class="lattice" aria-hidden="true"></canvas>
        <div class="open-body">
          <h1>orior</h1>
          <p id="open-said"></p>
          <button class="primary" id="open-button" type="button">Open</button>
        </div>
      </section>
    </main>

    <section class="term" id="term" hidden>
      <div class="term-grip" id="term-grip" aria-hidden="true"></div>
      <div class="term-view" id="term-view"></div>
      <textarea class="term-keys" id="term-keys" aria-label="Terminal" spellcheck="false" autocomplete="off" autocapitalize="off"></textarea>
    </section>

    <script type="module" src="main.js"></script>
  </body>
</html>

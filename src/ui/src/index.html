<html lang="en" data-scheme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>orior</title>
    <style>
      html { background: #131331; color-scheme: dark; }
      html[data-scheme="light"] { background: #fbfbfe; color-scheme: light; }
    </style>
    <script src="early.js"></script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body data-view="run">
    <header class="bar">
      <span class="bar-mark" id="bar-mark"></span>
      <nav class="menubar" id="menubar" role="menubar" aria-label="orior"></nav>
      <span class="tree" id="tree-path"></span>
      <button class="scheme" id="scheme" type="button" aria-label="Light"></button>
    </header>
    <nav class="modes" role="tablist" aria-label="View">
      <button class="mode-tab" type="button" role="tab" id="tab-run" data-view="run" aria-controls="mode-run" aria-selected="true">Run</button>
      <button class="mode-tab" type="button" role="tab" id="tab-edit" data-view="edit" aria-controls="mode-edit" aria-selected="false" tabindex="-1">Edit</button>
    </nav>

    <main class="shell">
      <section class="mode" id="mode-run" data-active="true">
        <aside class="side" id="job-side">
          <div class="side-inner">
            <input class="filter" id="job-filter" type="search" placeholder="Search" spellcheck="false" />
            <div class="jobs" id="jobs"></div>
          </div>
        </aside>
        <div class="stage" id="job-stage"></div>
      </section>

      <section class="mode" id="mode-edit" data-active="false">
        <aside class="side explorer" id="explorer">
          <div class="side-inner">
            <div class="explorer-head">
              <h2>Explorer</h2>
              <button class="explorer-more" id="explorer-more" type="button" aria-label="Views and More Actions" aria-haspopup="menu">…</button>
            </div>
            <input class="filter" id="file-filter" type="search" placeholder="Search" spellcheck="false" />
            <div class="panes" id="panes">
              <section class="pane" data-pane="search">
                <button class="pane-head" type="button" data-depth="-1" data-key="pane:search" aria-expanded="true">Search</button>
                <div class="pane-body search-body">
                  <div class="search-box">
                    <input class="filter" id="search-query" type="search" placeholder="Search in files" spellcheck="false" aria-label="Search in files" />
                    <div class="search-options" id="search-options">
                      <span role="checkbox" tabindex="0" aria-checked="false" data-option="case" title="Match Case">Aa</span>
                      <span role="checkbox" tabindex="0" aria-checked="false" data-option="word" title="Match Whole Word">ab</span>
                      <span role="checkbox" tabindex="0" aria-checked="false" data-option="regex" title="Use Regular Expression">.*</span>
                    </div>
                  </div>
                  <p class="search-said" id="search-said" aria-live="polite"></p>
                  <div class="search-hits" id="search-hits"></div>
                </div>
              </section>
              <section class="pane" data-pane="usages">
                <button class="pane-head" type="button" data-depth="-1" data-key="pane:usages" aria-expanded="true">Usages</button>
                <div class="pane-body search-body">
                  <p class="search-said" id="usages-said" aria-live="polite"></p>
                  <div class="search-hits" id="usages-hits"></div>
                </div>
              </section>
              <section class="pane" data-pane="open">
                <button class="pane-head" type="button" data-depth="-1" data-key="pane:open" aria-expanded="true">Open Editors</button>
                <div class="pane-body" id="open-editors"></div>
              </section>
              <section class="pane" data-pane="folder">
                <button class="pane-head" type="button" data-depth="-1" data-key="pane:folder" aria-expanded="true"></button>
                <div class="pane-body files" id="files"></div>
              </section>
              <section class="pane" data-pane="outline">
                <button class="pane-head" type="button" data-depth="-1" data-key="pane:outline" aria-expanded="false">Outline</button>
                <div class="pane-body" id="outline"></div>
              </section>
              <section class="pane" data-pane="timeline">
                <button class="pane-head" type="button" data-depth="-1" data-key="pane:timeline" aria-expanded="false">Timeline</button>
                <div class="pane-body" id="timeline"></div>
              </section>
            </div>
          </div>
        </aside>
        <div class="desk">
          <div class="tabs" id="tabs" role="tablist"></div>
          <nav class="crumbs" id="crumbs" aria-label="Breadcrumbs" hidden></nav>
          <div class="editor" id="editor"></div>
          <div class="binary" id="binary" hidden></div>
          <div class="empty" id="edit-empty" hidden>
            <canvas class="lattice" aria-hidden="true"></canvas>
            <div class="empty-body">
              <h1 data-wordmark>orior</h1>
            </div>
          </div>
        </div>
        <aside class="defs-side" id="defs-side">
          <div class="side-inner defs" id="defs"></div>
        </aside>
      </section>

      <section class="loading" id="loading">
        <canvas class="lattice" aria-hidden="true"></canvas>
        <div class="eye-box" aria-hidden="true">
          <canvas class="eye"></canvas>
          <canvas class="plasma"></canvas>
        </div>
      </section>

      <section class="open" id="open-tree" hidden>
        <canvas class="lattice" aria-hidden="true"></canvas>
        <div class="open-body">
          <h1 data-wordmark>orior</h1>
          <p id="open-said"></p>
          <button class="primary" id="open-button" type="button">Open</button>
          <button class="secondary" id="clone-button" type="button">Clone Repository…</button>
        </div>
      </section>
    </main>

    <section class="debug" id="debug" hidden aria-label="Debug">
      <div class="term-grip" id="debug-grip" aria-hidden="true"></div>
      <div class="debug-bar" id="debug-bar"><span class="debug-said" id="debug-said" aria-live="polite"></span></div>
      <div class="debug-body">
        <section class="debug-col debug-frames-col" aria-label="Frames">
          <h3>Frames</h3>
          <div class="debug-list" id="debug-frames"></div>
        </section>
        <section class="debug-col" aria-label="Variables">
          <h3>Variables</h3>
          <input class="debug-field" id="debug-watch" type="text" placeholder="Add a watch: an expression, then Enter" spellcheck="false" />
          <div class="debug-list" id="debug-vars"></div>
        </section>
        <section class="debug-col debug-console" aria-label="Console">
          <h3>Console</h3>
          <div class="debug-out" id="debug-out"></div>
          <input class="debug-field" id="debug-repl" type="text" placeholder="Evaluate in the chosen frame, then Enter" spellcheck="false" />
        </section>
      </div>
    </section>

    <section class="term" id="term" hidden>
      <div class="term-grip" id="term-grip" aria-hidden="true"></div>
      <div class="term-view" id="term-view"></div>
      <textarea class="term-keys" id="term-keys" aria-label="Terminal" spellcheck="false" autocomplete="off" autocapitalize="off"></textarea>
    </section>

    <footer class="statusbar" id="statusbar">
      <span class="status-branch" id="status-branch" hidden></span>
      <span class="pulse" id="pulse"></span>
      <button class="status-said" id="status-said" type="button" hidden></button>
      <button class="status-report" id="status-report" type="button" hidden></button>
      <button class="status-zoom" id="status-zoom" type="button" hidden></button>
      <span class="status-memory" id="status-memory" hidden></span>
    </footer>

    <script type="module" src="main.js"></script>
  </body>
</html>

#
# orior's snap, as the Snap Store builds it: the window and the command line built from the tree. An
# IDE runs the machine's own compilers, SDKs and tools: the snap's confinement is classic, which the
# Snap Store grants on review, and orior runs them as any program of the machine runs them.

name: orior
title: orior
base: core24
version: '0.1.0'
summary: One window for the engine
description: |
  Run starts every build, ingest, run, render, sim, viewer, stage pipeline and test suite in the
  tree, shows their output as it arrives, and opens each page a viewer writes in a window of its own.
  Edit is the editor for .g, .gsm and the k-files, with each file type's definition beside the file.
license: AGPL-3.0-or-later
grade: stable
confinement: classic

apps:
  orior:
    command: bin/orior
    desktop: share/applications/com.dstroy0.orior.desktop
  cli:
    command: bin/orior-cli

parts:
  orior:
    plugin: nil
    source: ../..
    build-snaps:
      - rustup
    build-packages:
      - build-essential
      - pkg-config
      - libwebkit2gtk-4.1-dev
      - libgtk-3-dev
      - librsvg2-dev
      - libssl-dev
    stage-packages:
      - libwebkit2gtk-4.1-0
      - libgtk-3-0
      - librsvg2-2
    override-build: |
      rustup toolchain install stable --profile minimal
      cargo +stable build --release --manifest-path src-tauri/Cargo.toml
      cargo +stable build --release --manifest-path cli/Cargo.toml
      install -Dm755 src-tauri/target/release/orior "$CRAFT_PART_INSTALL/bin/orior"
      install -Dm755 cli/target/release/orior-cli "$CRAFT_PART_INSTALL/bin/orior-cli"
      install -Dm644 packaging/linux/com.dstroy0.orior.desktop "$CRAFT_PART_INSTALL/share/applications/com.dstroy0.orior.desktop"
      install -Dm644 src-tauri/icons/128x128.png "$CRAFT_PART_INSTALL/share/icons/hicolor/128x128/apps/com.dstroy0.orior.png"

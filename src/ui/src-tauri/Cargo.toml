[package]
name = "orior-ui"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later OR LicenseRef-Commercial OR LicenseRef-Educational"
rust-version = "1.85"

[lib]
name = "orior_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "orior"
path = "src/main.rs"

# A plain cargo build, run or install builds the app as released, with the page inside it; cargo
# tauri dev builds without default features and serves the page as it changes.
[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
orior-cli = { path = "../cli" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dunce = "1"
portable-pty = "0.9.0"
arboard = { version = "3.6.1", default-features = false }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = "0.62"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Printing", "Win32_System_DataExchange", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Memory", "Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

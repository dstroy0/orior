[package]
name = "orior-cli"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later OR LicenseRef-Commercial OR LicenseRef-Educational"
rust-version = "1.85"

[lib]
name = "orior_cli"
path = "src/lib.rs"

[[bin]]
name = "orior-cli"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
dunce = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Environment", "Win32_System_IO", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

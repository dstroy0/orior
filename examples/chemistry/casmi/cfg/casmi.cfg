{
  "scheme": "casmi.cfg",
  "version": 1,
  "legend": {
    "goal": "for each test molecule, up to 25 SMILES, best first; a guess is correct where its InChIKey14 is the answer's, and the molecule scores 1 / rank of its first correct guess",
    "rank": {
      "window": "a train formula is a candidate for a query spectrum where its exact ion for the query's adduct, I, puts the query's precursor error D / N = (x |z| - I) / I inside the envelope of the query's mode: D_low / N_low <= D / N <= D_high / N_high, by COMPARE of cross products",
      "match": "a query peak q and a reference peak r match where (q - r) / r is inside the same envelope; the lane's weight is 4 x I_q x I_r where they match and 0 where they do not, 4 the product of the two verdicts (1 - c_high)(1 + c_low), each c exactly -1 or +1",
      "peak": "each query peak keeps its one heaviest matched weight, by a COMPARE tournament; peaks are never summed within a window",
      "score": "a query spectrum against a reference spectrum: the exact pair (M^2, Q x R), M = the sum of the peaks' kept weights, Q and R the sums of I^2 over the query's and the reference's peaks; each spectrum's intensities on its row's one scale, which cancels",
      "structure": "a structure's score for a molecule is its heaviest pair score over the molecule's spectra and the structure's reference spectra of the same ionization mode, by a COMPARE tournament",
      "list": "a molecule's structures, the scored by repeated COMPARE tournaments heaviest first, then the unscored in structure order, the first 25 written"
    }
  },
  "envelope": {
    "legend": "D / N lowest and highest the test's own pipeline measured on enveda-np-examples, timsTOF, for each mode; D and N exact, their ratio unitless",
